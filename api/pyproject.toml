[project]
name = "optcg-collection-api"
version = "0.1.0"
description = "API za One Piece TCG katalog i osobne kolekcije"
requires-python = ">=3.11"

# Kao na predavanju 1, ovisnosti se instaliraju preko requirements.txt.

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
